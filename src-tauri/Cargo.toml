[package]
name = "halation-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never goes to crates.io; it ships inside the app bundle.
publish = false
description = "Halation desktop shell"

[lib]
name = "halation_tauri_lib"
# staticlib/cdylib are required for the mobile targets Tauri generates; rlib
# keeps the crate usable from tests and from main.rs.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
halation-core = { path = "../crates/halation-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# keyring 4 split the platform backends into separate store crates; the default
# `v1` feature pulls in Apple Keychain, Windows Credential Manager and
# Secret Service, which is exactly the set we want.
keyring = "4"
# Bundled SQLite: no system dependency on either platform, and the schema is
# ours to migrate rather than the OS vendor's to change under us.
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
