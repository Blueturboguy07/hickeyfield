<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Hickeyfield: the reddish bloom that haloes a bright highlight on film stock.
    The mark is the phenomenon itself — a hot core bleeding a vermilion halo.
  -->
  <defs>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD8C4" stop-opacity="1"/>
      <stop offset="18%"  stop-color="#FF8A63" stop-opacity="0.95"/>
      <stop offset="42%"  stop-color="#FF4A1C" stop-opacity="0.72"/>
      <stop offset="70%"  stop-color="#E03A0F" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF4A1C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#FF8A63"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF8A63"/>
    </linearGradient>

    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#131416"/>

    <!-- the halo -->
    <circle cx="256" cy="256" r="212" fill="url(#bloom)"/>

    <!-- the blown-out highlight that causes it -->
    <g filter="url(#soften)">
      <rect x="236" y="126" width="40" height="260" rx="20" fill="url(#core)"/>
    </g>
    <rect x="245" y="134" width="22" height="244" rx="11" fill="#FFFFFF"/>
  </g>
</svg>
