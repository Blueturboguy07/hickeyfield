[graph]
all-features = true

[licenses]
# We ship AGPL-3.0-or-later. Permissive and weak-copyleft inbound licences are
# fine; anything that adds downstream restrictions is not, because AGPL forbids
# us from imposing them.
version = 2
# Several entries are here for dependencies we know are coming (the GPL family,
# once the FFmpeg tooling lands) rather than ones we have today, so an unused
# allowance is not a finding.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    # The webpki root-certificate bundle. A permissive data licence covering
    # the CA list itself, not code.
    "CDLA-Permissive-2.0",
    # Our own crates.
    "AGPL-3.0-or-later",
    # Compatible inbound copyleft. Accepted knowingly: taking any of these
    # forecloses relicensing to something permissive later.
    "GPL-3.0",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "AGPL-3.0",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# A wildcard on a crates.io dependency is a supply-chain hazard; a wildcard on
# our own workspace path dependency is just how workspaces work.
wildcards = "deny"
allow-wildcard-paths = true

# The hard blocklist from the plan. These are not dependency-hygiene
# preferences — each one would either make the distribution unlawful or force a
# licence change.
deny = [
    # Not OSI. Company licence required, and it forbids derivative
    # relicensing, so it cannot ship inside an AGPL distribution.
    { crate = "remotion", reason = "Remotion License: not OSI, forbids derivative relicensing" },
    # SSPL. The SDK is GPL-3.0 and fine; the server is not distributable here.
    { crate = "inngest", reason = "SSPL: incompatible with AGPL distribution" },
]

[advisories]
version = 2
yanked = "deny"
# Security vulnerabilities always fail. "Unmaintained" is scoped to crates we
# actually chose: the transitive set is dominated by Tauri's GTK3 chain, which
# only builds on Linux — a platform we do not ship — and which we could not fix
# without forking Tauri. Failing CI on it would train people to ignore CI.
unmaintained = "workspace"

ignore = [
    # glib reaches the lockfile because cargo resolves every platform, but it
    # is a Linux-only Tauri dependency: `cargo tree --target` reports zero glib
    # nodes for both aarch64-apple-darwin and x86_64-pc-windows-msvc, the only
    # targets we ship. The unsound code is therefore never compiled into any
    # artifact a user receives. Re-evaluate the moment a Linux target is added.
    { id = "RUSTSEC-2024-0429", reason = "glib is Linux-only; zero nodes on both shipped targets" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
